name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.14"   # same as the development laptop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      # Regenerate into a temporary folder (never over the committed data): proves the generator and its
      # 40 validation checks run. Byte-for-byte reproducibility is asserted by tests/test_generator.py,
      # which compares against data/ only when NumPy/pandas match the versions in dataset_info.json.
      - name: Data generator runs and validates
        shell: bash
        run: python scripts/generate_data.py --out "${{ runner.temp }}/regenerated"
      - name: Run pytest (engine, reconciliation, generator and API tests)
        working-directory: backend
        run: python -m pytest -rs
      - name: Fail if any API test was skipped
        working-directory: backend
        shell: bash
        run: |
          python -m pytest tests/test_api.py -q -rs | tee api.log
          if grep -q "skipped" api.log; then echo "API tests were skipped"; exit 1; fi
      - name: Export Power BI files
        run: python scripts/export_powerbi.py

  frontend:
    name: Frontend (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22"]
        include:
          - os: ubuntu-latest
            node: "20"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests (Vitest)
        run: npm test
      - name: Type-check and production build
        run: npm run build
      - name: Upload production build
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
